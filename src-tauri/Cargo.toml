[package]
name = "lemuel-scamp"
version = "0.1.0"
description = "Lemuel Scamp — an unofficial Arknights desktop pet for Windows"
authors = ["JNGKZbird"]
license = "Apache-2.0"
repository = "https://github.com/JNGKZbird/lemuel-scamp"
homepage = "https://github.com/JNGKZbird/lemuel-scamp"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lemuel_scamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
# 0.13 默认走 rustls + aws-lc-rs（Windows 上要 CMake/NASM）；改用系统 TLS（SChannel）。
# system-proxy 让它同时读取 Windows 系统代理，FLClash 这类工具不必再导出环境变量。
reqwest = { version = "0.13", default-features = false, features = [
  "native-tls",
  "charset",
  "http2",
  "system-proxy",
  "stream",
] }
sha2 = "0.10"
# 只用到 sync::Notify 与 time::timeout：让下载在卡住时能被取消/超时打断。
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
# 只解压，不需要 zopfli 编码器；zlib-rs 是纯 Rust 后端，Windows 上无需 C 工具链。
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
