<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="0" stdDeviation="10" flood-color="#5a4a3a" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif; }
      .label { font-size: 24px; fill: #5a4a3a; }
      .small { font-size: 19px; fill: #9a7a5a; }
      .tiny { font-size: 17px; fill: #b9a898; }
      .accent { fill: #b3541e; font-weight: 600; }
      .row { font-size: 21px; fill: #5a4a3a; }
    </style>
  </defs>

  <rect width="1400" height="840" fill="#f6f2ec"/>
  <text x="60" y="38" class="label">捣蛋鬼计划 · 右侧全高总控台（按 1440×900 逻辑屏等比示意）</text>

  <!-- Screen -->
  <rect x="60" y="60" width="1200" height="750" rx="14" fill="#ffffff" stroke="#d8cabb" stroke-width="2"/>
  <text x="84" y="92" class="small">屏幕工作区 1440 × 900 逻辑像素</text>
  <text x="84" y="112" class="tiny">物理 2880 × 1800 ｜ 缩放 200%</text>

  <!-- Pets -->
  <g filter="url(#shadow)">
    <rect x="310" y="318" width="217" height="233" rx="10" fill="#fff8f0" stroke="#ead7c2"/>
    <rect x="552" y="318" width="217" height="233" rx="10" fill="#fff8f0" stroke="#ead7c2"/>
  </g>
  <g fill="#ffb98a" opacity="0.9">
    <circle cx="418" cy="420" r="36"/>
    <rect x="390" y="455" width="56" height="48" rx="24"/>
    <circle cx="660" cy="420" r="36"/>
    <rect x="632" y="455" width="56" height="48" rx="24"/>
  </g>
  <g fill="#fff">
    <circle cx="418" cy="420" r="20"/>
    <circle cx="660" cy="420" r="20"/>
  </g>
  <text x="418" y="505" text-anchor="middle" class="label">能天使</text>
  <text x="660" y="505" text-anchor="middle" class="label">新约能天使</text>
  <text x="418" y="527" text-anchor="middle" class="tiny">角色窗 260 × 280</text>
  <text x="660" y="527" text-anchor="middle" class="tiny">角色窗 260 × 280</text>

  <text x="1010" y="744" class="tiny">宽 320 ｜ 可调 280–360</text>

  <!-- Console: 320/1440*1200 = 267 wide, full height 750 -->
  <g filter="url(#shadow)">
    <rect x="993" y="60" width="267" height="750" rx="14" fill="#fffaf3" stroke="#ff9d3c" stroke-width="2"/>
  </g>
  <rect x="993" y="60" width="267" height="45" rx="14" fill="#ffe7cf"/>
  <rect x="993" y="92" width="267" height="13" fill="#ffe7cf"/>
  <text x="1010" y="89" class="row accent">总控台</text>
  <!-- minimize -->
  <line x1="1189" y1="84" x2="1203" y2="84" stroke="#b3541e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- close -->
  <circle cx="1236" cy="84" r="13" fill="#ffffff" stroke="#e5b98e"/>
  <path d="M1231 79 L1241 89 M1241 79 L1231 89" stroke="#b3541e" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Pet cards -->
  <text x="1010" y="140" class="row">能天使</text>
  <rect x="1010" y="154" width="233" height="42" rx="10" fill="#fff1e2" stroke="#f0d2b6"/>
  <rect x="1014" y="158" width="73" height="34" rx="8" fill="#ffffff"/>
  <rect x="1091" y="158" width="73" height="34" rx="8" fill="#ff9d3c"/>
  <rect x="1168" y="158" width="72" height="34" rx="8" fill="#ffffff"/>
  <text x="1050" y="180" text-anchor="middle" font-size="18" fill="#9a7a5a">偏静</text>
  <text x="1127" y="180" text-anchor="middle" font-size="18" fill="#ffffff">标准</text>
  <text x="1204" y="180" text-anchor="middle" font-size="18" fill="#9a7a5a">偏动</text>

  <text x="1010" y="230" class="row">新约能天使</text>
  <rect x="1010" y="244" width="233" height="42" rx="10" fill="#fff1e2" stroke="#f0d2b6"/>
  <rect x="1014" y="248" width="73" height="34" rx="8" fill="#ffffff"/>
  <rect x="1091" y="248" width="73" height="34" rx="8" fill="#ffffff"/>
  <rect x="1168" y="248" width="72" height="34" rx="8" fill="#ff9d3c"/>
  <text x="1050" y="270" text-anchor="middle" font-size="18" fill="#9a7a5a">偏静</text>
  <text x="1127" y="270" text-anchor="middle" font-size="18" fill="#9a7a5a">标准</text>
  <text x="1204" y="270" text-anchor="middle" font-size="18" fill="#ffffff">偏动</text>

  <!-- Nav -->
  <line x1="1010" y1="312" x2="1243" y2="312" stroke="#ead7c2"/>
  <text x="1010" y="346" class="row">启动时显示主设置</text>
  <rect x="1207" y="332" width="36" height="22" rx="11" fill="#ff9d3c"/>
  <circle cx="1234" cy="343" r="9" fill="#ffffff"/>
  <line x1="1010" y1="372" x2="1243" y2="372" stroke="#f3e5d6"/>
  <text x="1010" y="406" class="row">通用</text>
  <text x="1240" y="406" text-anchor="end" class="small">›</text>
  <line x1="1010" y1="422" x2="1243" y2="422" stroke="#f3e5d6"/>
  <text x="1010" y="456" class="row">关于</text>
  <text x="1240" y="456" text-anchor="end" class="small">›</text>

  <!-- Bottom status -->
  <line x1="1010" y1="770" x2="1243" y2="770" stroke="#f3e5d6"/>
  <text x="1010" y="792" class="tiny">版本 0.1.0 ｜ 本地运行</text>

  <!-- Callouts -->
  <line x1="993" y1="660" x2="880" y2="700" stroke="#c9b6a2" stroke-width="1.2"/>
  <text x="860" y="722" text-anchor="end" class="small">贴右边缘 · 全高 · 可最小化</text>
  <line x1="552" y1="560" x2="520" y2="610" stroke="#c9b6a2" stroke-width="1.2"/>
  <text x="500" y="632" text-anchor="end" class="small">两只角色窗：260 × 280，透明区穿透</text>

  <text x="60" y="820" class="tiny">说明：控制台宽按 320 示意（可调 280–360）；高度取工作区全高；窗口用逻辑像素，工作区用物理像素换算。</text>
</svg>
