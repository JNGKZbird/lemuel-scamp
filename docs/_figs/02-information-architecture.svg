<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <style>
      text { font-family: 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif; }
      .h { font-size: 30px; font-weight: 600; fill: #3f3228; }
      .label { font-size: 22px; fill: #5a4a3a; }
      .small { font-size: 19px; fill: #9a7a5a; }
      .tiny { font-size: 17px; fill: #b9a898; }
      .accent { fill: #b3541e; font-weight: 600; }
      .box { fill: #fffaf3; stroke: #e2cdb8; stroke-width: 1.5; }
      .boxAccent { fill: #fff0df; stroke: #ff9d3c; stroke-width: 2; }
      .boxFuture { fill: #faf7f2; stroke: #c9b6a2; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .line { stroke: #c9b6a2; stroke-width: 1.5; fill: none; }
      .lineFuture { stroke: #b9a898; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c9b6a2"/>
    </marker>
    <marker id="arrowFuture" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b9a898"/>
    </marker>
  </defs>

  <rect width="1400" height="780" fill="#f6f2ec"/>
  <text x="60" y="40" class="h">捣蛋鬼计划 · 设置界面信息架构（主设置第一版）</text>
  <text x="60" y="66" class="small">实线 = 第一版实现；虚线 = 预留，不渲染、不出现死按钮</text>

  <!-- Root -->
  <rect x="530" y="92" width="340" height="62" rx="12" class="boxAccent"/>
  <text x="700" y="120" text-anchor="middle" class="label accent">主设置（单例窗口）</text>
  <text x="700" y="140" text-anchor="middle" class="small">320 宽 ｜ 右边缘全高 ｜ 启动出现</text>

  <!-- Branches -->
  <path d="M700 154 L700 188 L300 188 L300 222" class="line" marker-end="url(#arrow)"/>
  <path d="M700 154 L700 222" class="line" marker-end="url(#arrow)"/>
  <path d="M700 154 L700 188 L1100 188 L1100 222" class="line" marker-end="url(#arrow)"/>

  <!-- Home -->
  <rect x="150" y="222" width="300" height="78" rx="12" class="boxAccent"/>
  <text x="300" y="250" text-anchor="middle" class="label accent">总览 / 主控台</text>
  <text x="300" y="272" text-anchor="middle" class="small">状态 + 三档快捷控制</text>
  <text x="300" y="289" text-anchor="middle" class="tiny">第一屏，不是密集表单</text>

  <!-- General -->
  <rect x="550" y="222" width="300" height="78" rx="12" class="box"/>
  <text x="700" y="250" text-anchor="middle" class="label">通用</text>
  <text x="700" y="272" text-anchor="middle" class="small">启动行为 / 设置保存位置</text>
  <text x="700" y="289" text-anchor="middle" class="small">恢复默认设置（二次确认）</text>

  <!-- About -->
  <rect x="950" y="222" width="300" height="78" rx="12" class="box"/>
  <text x="1100" y="250" text-anchor="middle" class="label">关于</text>
  <text x="1100" y="272" text-anchor="middle" class="small">版本 / 运行时 / 素材版权</text>

  <!-- Character cards -->
  <path d="M300 300 L300 340" class="line" marker-end="url(#arrow)"/>
  <rect x="130" y="340" width="160" height="112" rx="12" class="box"/>
  <text x="210" y="366" text-anchor="middle" class="label">能天使</text>
  <rect x="145" y="382" width="130" height="32" rx="8" fill="#fff1e2" stroke="#e9cfb5"/>
  <text x="210" y="403" text-anchor="middle" class="small">三档快捷</text>
  <text x="210" y="434" text-anchor="middle" class="tiny">档位快捷控制</text>

  <rect x="310" y="340" width="160" height="112" rx="12" class="box"/>
  <text x="390" y="366" text-anchor="middle" class="label">新约能天使</text>
  <rect x="325" y="382" width="130" height="32" rx="8" fill="#fff1e2" stroke="#e9cfb5"/>
  <text x="390" y="403" text-anchor="middle" class="small">三档快捷</text>
  <text x="390" y="434" text-anchor="middle" class="tiny">档位快捷控制</text>

  <!-- Secondary future -->
  <path d="M470 396 L560 396" class="lineFuture" marker-end="url(#arrowFuture)"/>
  <rect x="560" y="340" width="300" height="112" rx="12" class="boxFuture"/>
  <text x="710" y="368" text-anchor="middle" class="label">副设置（以后）</text>
  <text x="710" y="392" text-anchor="middle" class="small">每角色深度配置</text>
  <text x="710" y="412" text-anchor="middle" class="small">行为细节 / 皮肤 / 作息</text>
  <text x="710" y="434" text-anchor="middle" class="tiny">与主设置同一时间只显示一个</text>

  <!-- Schedule future -->
  <path d="M700 300 L700 500" class="lineFuture" marker-end="url(#arrowFuture)"/>
  <rect x="550" y="500" width="300" height="104" rx="12" class="boxFuture"/>
  <text x="700" y="528" text-anchor="middle" class="label">作息（更后）</text>
  <text x="700" y="550" text-anchor="middle" class="small">所在地 / 时段 / 日出日落</text>
  <text x="700" y="570" text-anchor="middle" class="small">午休 / 睡眠强度</text>
  <text x="700" y="590" text-anchor="middle" class="tiny">等主线时段设计落定后接入</text>

  <!-- Other future -->
  <path d="M1100 300 L1100 500" class="lineFuture" marker-end="url(#arrowFuture)"/>
  <rect x="950" y="500" width="300" height="104" rx="12" class="boxFuture"/>
  <text x="1100" y="528" text-anchor="middle" class="label">其他未来页</text>
  <text x="1100" y="550" text-anchor="middle" class="small">自动避让 / 大小 / 隐藏召回</text>
  <text x="1100" y="570" text-anchor="middle" class="small">皮肤入口 / 诊断</text>
  <text x="1100" y="590" text-anchor="middle" class="tiny">注册表标记不可用，不渲染</text>

  <!-- Registry -->
  <rect x="130" y="620" width="1120" height="92" rx="12" fill="#fffdf9" stroke="#e2cdb8"/>
  <text x="150" y="650" class="label">页面注册表</text>
  <text x="150" y="674" class="small">id / title / scope: global | character / available: boolean / component</text>
  <text x="150" y="696" class="tiny">只有 available:true 的页面进入导航；加页面 = 注册表 + 组件。</text>

  <text x="60" y="756" class="tiny">注：第一版三档放在总览角色卡上；副设置以后不再重复三档。</text>
</svg>
